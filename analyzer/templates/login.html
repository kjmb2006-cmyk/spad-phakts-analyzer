<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — SPAD Analyzer</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/spad_favicon.png') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1A5276; --teal: #17A589; --bg: #F0F4F8; --text: #1C2833; --muted: #718096;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, #2E4A8A 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 24px;
    }
    .login-card {
      background: #fff; border-radius: 18px; padding: 36px 34px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .login-logo {
      width: 64px; height: 64px; margin-bottom: 18px;
    }
    .login-logo img { width: 100%; height: 100%; object-fit: contain; }
    .login-card h1 { font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .login-card p.subtitle { color: var(--muted); font-size: .85rem; margin-bottom: 26px; }

    .access-block {
      border-radius: 14px; padding: 20px 20px 18px; border: 1.5px solid transparent;
    }
    .access-block + .access-block { margin-top: 14px; }
    .access-block--data    { background: #EAF5F1; border-color: #BFE6D9; }
    .access-block--invite  { background: #F4F6F9; border-color: #E1E6ED; }

    .access-block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .access-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff;
    }
    .access-block--data   .access-icon { background: var(--teal); }
    .access-block--invite .access-icon { background: var(--navy); }
    .access-block-title { font-size: .88rem; font-weight: 700; color: var(--navy); line-height: 1.2; }
    .access-block-desc  { font-size: .72rem; color: var(--muted); line-height: 1.3; margin-top: 1px; }

    .access-block .form-control {
      border-radius: 8px; border: 1.5px solid #D5D8DC; font-size: .88rem;
      padding: 9px 12px;
    }
    .access-block .form-control:focus {
      box-shadow: none;
    }
    .access-block--data   .form-control:focus { border-color: var(--teal); }
    .access-block--invite .form-control:focus { border-color: var(--navy); }

    .btn-login {
      background: var(--teal); color: #fff; font-weight: 600; border-radius: 8px;
      width: 100%; padding: 9px 0; border: none; font-size: .88rem;
    }
    .btn-login:hover { background: #148f77; color: #fff; }
    .btn-login-invite {
      background: var(--navy); color: #fff; font-weight: 600; border-radius: 8px;
      width: 100%; padding: 9px 0; border: none; font-size: .88rem;
    }
    .btn-login-invite:hover { background: #164863; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><img src="{{ url_for('static', filename='img/spad_logo.png') }}" alt="SPAD"></div>
    <h1>SPAD Analyzer</h1>
    <p class="subtitle">Accès réservé à l'équipe SPAD — choisissez votre accès et saisissez le mot de passe correspondant.</p>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <div class="access-block access-block--data">
      <div class="access-block-head">
        <div class="access-icon"><i class="bi bi-unlock-fill"></i></div>
        <div>
          <div class="access-block-title">Accès complet — Data</div>
          <div class="access-block-desc">Import, analyses, exports, connexion KoboToolbox</div>
        </div>
      </div>
      <form method="post">
        <input type="hidden" name="access" value="data">
        <div class="mb-2">
          <input type="password" class="form-control" id="password-data" name="password"
                 placeholder="Mot de passe Data" autofocus>
        </div>
        <button type="submit" class="btn btn-login"><i class="bi bi-unlock-fill me-1"></i>Se connecter</button>
      </form>
    </div>

    <div class="access-block access-block--invite">
      <div class="access-block-head">
        <div class="access-icon"><i class="bi bi-eye-fill"></i></div>
        <div>
          <div class="access-block-title">Accès Invité — lecture seule</div>
          <div class="access-block-desc">Complétude nationale uniquement, sans export</div>
        </div>
      </div>
      <form method="post">
        <input type="hidden" name="access" value="invite">
        <div class="mb-2">
          <input type="password" class="form-control" id="password-invite" name="password"
                 placeholder="Mot de passe Invité">
        </div>
        <button type="submit" class="btn btn-login-invite"><i class="bi bi-eye-fill me-1"></i>Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
