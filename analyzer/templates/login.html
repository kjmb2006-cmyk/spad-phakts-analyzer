<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — SPAD Analyzer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1A5276; --teal: #17A589; --bg: #F0F4F8; --text: #1C2833; --muted: #718096;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, #2E4A8A 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      margin: 0;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .login-logo {
      width: 52px; height: 52px; background: var(--teal); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff; margin-bottom: 18px;
    }
    .login-card h1 { font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .login-card p.subtitle { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
    .btn-login {
      background: var(--teal); color: #fff; font-weight: 600; border-radius: 8px;
      width: 100%; padding: 10px 0; border: none;
    }
    .btn-login:hover { background: #148f77; color: #fff; }
    .form-label { font-size: .82rem; font-weight: 600; color: var(--text); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><i class="bi bi-bar-chart-line-fill"></i></div>
    <h1>SPAD Analyzer</h1>
    <p class="subtitle">Accès réservé à l'équipe SPAD — saisissez le mot de passe.</p>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" class="form-control" id="password" name="password" autofocus required>
      </div>
      <button type="submit" class="btn btn-login"><i class="bi bi-unlock-fill me-1"></i>Se connecter</button>
    </form>
  </div>
</body>
</html>
