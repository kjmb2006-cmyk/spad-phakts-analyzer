<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="hdr" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="#070b14"/>
  <!-- Header -->
  <rect width="390" height="56" fill="url(#hdr)"/>
  <text x="16" y="37" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="bold">PHAKTS · STUDIO</text>
  <!-- Status -->
  <rect x="290" y="16" width="80" height="24" rx="12" fill="#22c55e"/>
  <text x="304" y="33" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">En ligne</text>
  <!-- Input area -->
  <rect x="12" y="72" width="366" height="300" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="100" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Collez ou tapez votre questionnaire…</text>
  <!-- Output area -->
  <rect x="12" y="388" width="366" height="360" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="418" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Résultat</text>
  <text x="28" y="450" fill="#86efac" font-family="monospace" font-size="12">Age__1Y!Y</text>
  <text x="28" y="472" fill="#86efac" font-family="monospace" font-size="12">Emploi__B!boolean</text>
  <text x="28" y="494" fill="#86efac" font-family="monospace" font-size="12">Motivation__X!1*1Niveau_</text>
  <!-- Bottom actions -->
  <rect x="12" y="768" width="170" height="44" rx="8" fill="#2563eb"/>
  <text x="42" y="796" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Codifier</text>
  <rect x="196" y="768" width="182" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="222" y="796" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Exporter Excel</text>
</svg>
