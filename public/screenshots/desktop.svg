<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="hdr" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#070b14"/>
  <!-- Header -->
  <rect width="1280" height="56" fill="url(#hdr)"/>
  <text x="24" y="37" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="bold">PHAKTS · STUDIO</text>
  <text x="240" y="37" fill="rgba(255,255,255,0.7)" font-family="system-ui,sans-serif" font-size="14">Codification de santé publique — SPAD (WHO) / Dr Jean-Marc Bertrand KORANDJI</text>
  <!-- Status pill -->
  <rect x="1100" y="14" width="80" height="28" rx="14" fill="#22c55e"/>
  <text x="1118" y="33" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="600">En ligne</text>
  <!-- Left panel -->
  <rect x="24" y="76" width="600" height="620" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="44" y="110" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Collez ou tapez votre questionnaire ici…</text>
  <!-- Right panel -->
  <rect x="648" y="76" width="608" height="620" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="668" y="110" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Résultat de codification</text>
  <!-- Fake code rows -->
  <text x="668" y="145" fill="#86efac" font-family="monospace" font-size="13">Age__1Y!Y</text>
  <text x="668" y="170" fill="#86efac" font-family="monospace" font-size="13">Emploi__B!boolean</text>
  <text x="668" y="195" fill="#86efac" font-family="monospace" font-size="13">Motivation_Agents__X!1*1Niveau_</text>
  <!-- Action buttons -->
  <rect x="24" y="700" width="120" height="0" rx="6" fill="#2563eb" opacity="0"/>
</svg>
